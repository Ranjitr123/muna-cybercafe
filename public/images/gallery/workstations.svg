<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <!-- Workstation Desks -->
  <rect x="50" y="420" width="700" height="25" rx="4" fill="#334155"/>
  <!-- Monitor 1 -->
  <rect x="120" y="200" width="240" height="170" rx="8" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="130" y="210" width="220" height="150" rx="4" fill="url(#screenGrad)"/>
  <!-- Screen details -->
  <circle cx="240" cy="280" r="30" fill="#ffffff" opacity="0.2"/>
  <rect x="160" y="320" width="160" height="10" rx="2" fill="#ffffff" opacity="0.3"/>
  <rect x="230" y="370" width="20" height="50" fill="#475569"/>
  <rect x="200" y="415" width="80" height="8" rx="2" fill="#475569"/>
  <!-- Monitor 2 -->
  <rect x="440" y="200" width="240" height="170" rx="8" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="450" y="210" width="220" height="150" rx="4" fill="url(#screenGrad)"/>
  <circle cx="560" cy="280" r="30" fill="#ffffff" opacity="0.2"/>
  <rect x="480" y="320" width="160" height="10" rx="2" fill="#ffffff" opacity="0.3"/>
  <rect x="550" y="370" width="20" height="50" fill="#475569"/>
  <rect x="520" y="415" width="80" height="8" rx="2" fill="#475569"/>
  <!-- Keyboards -->
  <rect x="160" y="435" width="160" height="15" rx="3" fill="#64748b"/>
  <rect x="480" y="435" width="160" height="15" rx="3" fill="#64748b"/>
  <!-- Text Label -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Cyber Café Workstations</text>
  <text x="400" y="135" font-family="Arial, sans-serif" font-size="16" fill="#93c5fd" text-anchor="middle">High Speed Internet & Computer Access - Odisha</text>
</svg>
