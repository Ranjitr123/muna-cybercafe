<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#065f46"/>
  <g transform="translate(180, 160)">
    <rect x="0" y="0" width="440" height="260" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="120" height="260" fill="#047857"/>
    <circle cx="60" cy="130" r="30" fill="#ffffff"/>
    <path d="M 50 130 L 70 120 L 70 140 Z" fill="#047857"/>
    
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">IRCTC / Bus / Flight Ticket</text>
    <text x="150" y="80" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Confirmed Reservation Pass</text>
    
    <line x1="150" y1="100" x2="400" y2="100" stroke="#e2e8f0" stroke-width="2"/>
    
    <text x="150" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857">PASSENGER: Confirmed</text>
    <text x="150" y="170" font-family="Arial, sans-serif" font-size="13" fill="#334155">FROM: Odisha TO: Destination</text>

    <rect x="150" y="200" width="230" height="35" rx="6" fill="#ecfdf5"/>
    <text x="265" y="222" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Instant Ticket Assistance</text>
  </g>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Railway, Bus & Flight Ticket Booking</text>
</svg>
