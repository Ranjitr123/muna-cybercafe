<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="45%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Monitor Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Screen Inner Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Badge Glowing Accent Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Amber Glow -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Accent Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#frameGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Monitor Stand Base -->
  <path d="M 216 340 L 296 340 L 316 410 L 196 410 Z" fill="url(#frameGrad)" filter="url(#dropShadow)"/>
  <rect x="156" y="410" width="200" height="22" rx="11" fill="#e2e8f0"/>

  <!-- Main Desktop Monitor Frame -->
  <rect x="80" y="80" width="352" height="260" rx="28" fill="#0f172a" stroke="url(#frameGrad)" stroke-width="12" filter="url(#dropShadow)"/>

  <!-- Screen Display Area -->
  <rect x="98" y="98" width="316" height="224" rx="18" fill="url(#screenGrad)"/>

  <!-- Top Web Camera Dot -->
  <circle cx="256" cy="89" r="4" fill="#38bdf8"/>

  <!-- Screen Content Graphic: Cyber & Digital Hub Center Icon -->
  <g filter="url(#glow)">
    <!-- Central Digital Globe / Connected Shield Circle -->
    <circle cx="256" cy="210" r="54" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="8 4"/>
    <circle cx="256" cy="210" r="42" fill="url(#nodeGrad)"/>
    <circle cx="256" cy="210" r="20" fill="#ffffff"/>
    <circle cx="256" cy="210" r="10" fill="#0f172a"/>

    <!-- Connecting Circuit Lines & Nodes -->
    <!-- Top Left Node -->
    <line x1="160" y1="150" x2="220" y2="185" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="155" cy="146" r="10" fill="url(#cyanGrad)"/>

    <!-- Top Right Node -->
    <line x1="352" y1="150" x2="292" y2="185" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="357" cy="146" r="10" fill="url(#amberGrad)"/>

    <!-- Bottom Left Node -->
    <line x1="160" y1="270" x2="220" y2="235" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="155" cy="274" r="10" fill="url(#amberGrad)"/>

    <!-- Bottom Right Node -->
    <line x1="352" y1="270" x2="292" y2="235" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="357" cy="274" r="10" fill="url(#cyanGrad)"/>
  </g>

  <!-- Bottom Brand Sparkle / Accent -->
  <path d="M 256 312 L 260 322 L 270 326 L 260 330 L 256 340 L 252 330 L 242 326 L 252 322 Z" fill="#38bdf8"/>
</svg>
